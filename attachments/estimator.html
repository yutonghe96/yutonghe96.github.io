<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estimator</title>
<script src="https://cdn.plot.ly/plotly-3.0.1.min.js"></script>
<style>
  body { font-family: sans-serif; max-width: 1100px; margin: 0 auto; padding: 0 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px 16px; }
  label { display: flex; flex-direction: column; font-size: 13px; }
  input { width: 140px; }
  .scroll { overflow-x: auto; }
  th { font-size: 13px; font-weight: normal; text-align: left; }
  td input { width: 120px; }
  html { scrollbar-gutter: stable; overflow-y: scroll; } /* scrollbar never toggles, so page width never changes */
  .err { color: crimson; font-size: 13px; min-height: 1.3em; } /* reserve space: error text doesn't shift layout */
  .plot { height: 450px; } /* fixed size: one chart's redraw/purge never moves the other */
  @media (max-width: 700px) { .plot { height: 560px; } } /* phones: extra room for the legend above the chart */
  input.bad { outline: 2px solid crimson; }
  .tabs { display: flex; gap: 4px; margin: 16px 0 0; border-bottom: 1px solid #ccc; }
  .tabs button { padding: 6px 16px; border: 1px solid #ccc; border-bottom: none; background: #f4f4f4; cursor: pointer; font-size: 14px; }
  .tabs button.active { background: #fff; font-weight: bold; margin-bottom: -1px; padding-bottom: 7px; }
  h3 { font-size: 14px; margin: 14px 0 6px; }
  select { width: 260px; }
  #auto-summary { font-size: 14px; line-height: 1.5; min-height: 3em; }
  #auto-summary b { font-weight: 600; }
</style>
</head>
<body>
<div class="tabs"><button data-tab="manual" class="active">Manual</button><button data-tab="auto">Auto</button></div>

<div id="tab-manual">
<h2>Housing payments</h2>
<div id="housing">
<div class="row">
  <label>Mortgage (SEK)<input id="mortgage" type="text" inputmode="decimal" value="2.7e6"></label>
  <label>Down payment (SEK)<input id="down" type="text" inputmode="decimal" value="3e5"></label>
</div>
<div class="scroll"><table>
  <thead><tr><th>Start year</th><th>End year</th><th>Repayment rate / yr</th><th>Interest rate / yr</th><th>Avgift / month</th><th>Lump sum (SEK)</th><th></th></tr></thead>
  <tbody id="hplan"></tbody>
</table></div>
<button id="hadd">+ Add row</button>
</div>
<div class="err" id="err-housing"></div>
<div id="plot-housing" class="plot"></div>

<h2>Cumulative savings</h2>
<label>Base (SEK)<input id="base" type="text" inputmode="decimal" value="1.7e5"></label>
<div class="scroll"><table>
  <thead><tr><th>Start year</th><th>End year</th><th>Yearly addition (SEK)</th><th>Addition change / yr</th><th>Growth rate / yr</th><th></th></tr></thead>
  <tbody id="plan"></tbody>
</table></div>
<button id="add">+ Add row</button>
<div class="err" id="err-savings"></div>
<div id="plot-savings" class="plot"></div>
</div>

<div id="tab-auto" hidden>
<h2>Strategy search</h2>
<div id="auto-inputs">
<h3>Loan &amp; housing costs</h3>
<div class="row">
  <label>Mortgage (SEK)<input id="a-L" type="text" inputmode="decimal" value="2.7e6"></label>
  <label>Down payment (SEK)<input id="a-D" type="text" inputmode="decimal" value="3e5"></label>
  <label>Interest rate / yr<input id="a-r" type="text" inputmode="decimal" value="0.03"></label>
  <label>Avgift / month<input id="a-A" type="text" inputmode="decimal" value="6,000"></label>
  <label>Gross income / yr (blank = ignore)<input id="a-inc" type="text" inputmode="decimal" value=""></label>
</div>
<h3>Cash flow &amp; savings</h3>
<div class="row">
  <label>Monthly budget (SEK)<input id="a-X" type="text" inputmode="decimal" value="30,000"></label>
  <label>Budget change / yr<input id="a-dX" type="text" inputmode="decimal" value="0.02"></label>
  <label>Starting savings (SEK)<input id="a-P0" type="text" inputmode="decimal" value="1.7e5"></label>
  <label>Savings buffer (SEK)<input id="a-buf" type="text" inputmode="decimal" value="100,000"></label>
</div>
<h3>Market &amp; tax</h3>
<div class="row">
  <label>Expected return / yr<input id="a-g" type="text" inputmode="decimal" value="0.07"></label>
  <label>Volatility / yr<input id="a-sig" type="text" inputmode="decimal" value="0.15"></label>
  <label>Interest deduction<input id="a-tau" type="text" inputmode="decimal" value="0.3"></label>
  <label>Investment tax / yr<input id="a-kappa" type="text" inputmode="decimal" value="0.01"></label>
</div>
<h3>Goal</h3>
<div class="row">
  <label>Objective<select id="a-goal">
    <option value="networth">Maximise final net worth</option>
    <option value="target">Reach savings target earliest</option>
    <option value="both">Debt-free and savings target earliest</option>
    <option value="payoff">Pay off mortgage earliest</option>
  </select></label>
  <label>Savings target (SEK)<input id="a-S" type="text" inputmode="decimal" value="2e6"></label>
  <label>Horizon (years)<input id="a-N" type="text" inputmode="decimal" value="30"></label>
  <label>Confidence<input id="a-conf" type="text" inputmode="decimal" value="0.9"></label>
  <label>Simulated paths<input id="a-paths" type="text" inputmode="decimal" value="1000"></label>
</div>
</div>
<p><button id="a-run">Run</button> <span id="a-status" style="font-size:13px"></span></p>
<div class="err" id="err-auto"></div>
<div id="plot-pareto" class="plot"></div>
<div id="auto-summary"></div>
<div id="plot-fan" class="plot"></div>
</div>

<script>
// The maths is described in estimator_notes.md -- keep it in sync with monthly() and compound().
const rnd = x => { const r = Math.round(x); return Math.abs(x % 1) === 0.5 && r % 2 ? r - 1 : r; }; // Python round()
const hover = '%{y:,.0f}<extra></extra>';
// Amount fields (text inputs): accept "3,000,000" and arithmetic like "12*2000"; flag and reject anything unreadable.
function amount(id, label) {
  const el = document.getElementById(id), v = calc(el.value);
  el.classList.toggle('bad', Number.isNaN(v));
  if (Number.isNaN(v)) throw new Error(`Can't read ${label} "${el.value}".`);
  return v ?? 0;
}

// plan: [{ start, end, repay, interest, avgift, lump }], later rows override earlier ones where they overlap.
// lump: one-off change to the loan at the year-<start> mark (end of that year's last month, like one-time savings rows),
// added as-is to the remaining balance
// (negative = pay off, positive = borrow more; the balance can't go below 0).
// A row covers months (start-1)*12 .. end*12 (empty end = until the horizon); an empty cell leaves that parameter
// unset there. Unset months carry the previous value forward; months before the first set value use that first value.
function monthly(total, plan, months) {
  const p = { repay: Array(months).fill(null), interest: Array(months).fill(null), avgift: Array(months).fill(null) };
  const lump = Array(months).fill(0);
  for (const s of plan) {
    const st = rnd((s.start - 1) * 12);
    const li = rnd(s.start * 12) - 1;
    if (s.lump && li < months) lump[li] += s.lump;
    const en = s.end === null ? months : Math.min(rnd(s.end * 12), months);
    for (const k in p) if (s[k] !== null) for (let m = st; m < en; m++) p[k][m] = s[k];
  }
  for (const k in p) {
    let last = p[k].find(v => v !== null) ?? 0;
    p[k] = p[k].map(v => last = v ?? last);
  }
  const o = { repayment: [], interest: [], avgift: [], total: [], paid: [], remaining: [], lump: [] };
  let paid = 0;
  for (let m = 0; m < months; m++) {
    const avgift = p.avgift[m], remain = total - paid; // repayment rate applies to the original loan
    const rep = Math.min(total * p.repay[m] / 12, remain), int = remain * p.interest[m] / 12;
    paid += rep;
    const before = paid;
    paid = total - Math.max(total - paid + lump[m], 0); // lump sum after this month's payment; next month's interest uses the new balance
    o.lump.push(paid - before); // amount actually paid in (negative when borrowing more)
    o.repayment.push(rep); o.interest.push(int); o.avgift.push(avgift); o.total.push(rep + int + avgift);
    o.paid.push(paid); o.remaining.push(total - paid);
  }
  return o;
}

function compound(base, plan, ppy = 12) {
  // one-time rows have a single year (no end year); a range row like [5, 5] still spreads over that year
  const segs = plan.map(s => { const y = [].concat(s.year); return [y[0], y[y.length - 1], s, !Array.isArray(s.year)]; });
  const n = rnd(Math.max(...segs.map(s => s[1])) * ppy), add = Array(n).fill(0), rates = Array(n).fill(null);
  for (const [a, b, s, once] of segs) {
    const amt = s.yearly_addition ?? 0, ch = s.yearly_addition_change ?? 0, r = s.yearly_growth_rate;
    if (once) {
      const i = Math.min(Math.max(rnd(b * ppy) - 1, 0), n - 1);
      add[i] += amt; if (r != null) rates[i] = r;
    } else {
      const st = Math.max(rnd(Math.max(a - 1, 0) * ppy), 0), en = Math.min(rnd(b * ppy), n);
      for (let k = 0; k < en - st; k++) { add[st + k] += amt / ppy * (1 + ch) ** (k / ppy); if (r != null) rates[st + k] = r; }
    }
  }
  const o = { contributed: [], return: [], total: [] };
  let rate = 0, bal = base, con = base;
  for (let i = 0; i < n; i++) {
    if (rates[i] !== null) rate = rates[i];
    bal += bal * ((1 + rate) ** (1 / ppy) - 1) + add[i]; con += add[i];
    o.contributed.push(con); o.return.push(bal - con); o.total.push(bal);
  }
  return o;
}

// Month count -> "4 years 8 months", "14 years", "1 year 1 month", "8 months".
function ymLabel(m) {
  const y = Math.floor(m / 12), mo = m % 12, p = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  return [y && p(y, 'year'), mo && p(mo, 'month')].filter(Boolean).join(' ') || '0 months';
}
// Monthly points are evenly spaced, so a category axis keyed by ymLabel is still linear in time; the
// category text becomes the unified-hover title, and ticks are placed at whole years labelled as plain numbers.
function monthAxis(n) {
  const step = [1, 2, 5, 10, 20, 50].find(s => n / 12 / s <= 12) ?? 100, tickvals = [], ticktext = [];
  for (let y = step; y * 12 <= n; y += step) { tickvals.push(ymLabel(y * 12)); ticktext.push(y); }
  return { type: 'category', title: { text: 'year' }, ...(tickvals.length && { tickmode: 'array', tickvals, ticktext }) };
}

// Legend beside the chart on wide screens, above it on narrow ones (phones). Either way its size depends only on the
// trace names, never on the data, so typing in the inputs doesn't resize the plot area.
// Measured on the page body (minus its padding) so it also works while a tab is hidden.
const isNarrow = () => document.body.clientWidth - 32 < 700;
function legendLayout(wide, narrow) {
  return isNarrow()
    ? { legend: { groupclick: 'toggleitem', orientation: 'h', x: 0, xanchor: 'left', y: 1.02, yanchor: 'bottom' },
        margin: { ...narrow, t: 10, b: 50, autoexpand: true } } // top margin grows to fit the wrapped legend rows
    : { legend: { groupclick: 'toggleitem', xref: 'container', x: 1, xanchor: 'right', y: 1 },
        margin: { ...wide, t: 20, b: 50, autoexpand: false } }; // anchored to the container edge, margins fixed
}

function guarded(fn, errId) { // a failure in one chart shows a message instead of breaking the page
  return () => { try { fn(); document.getElementById(errId).textContent = ''; } catch (e) { document.getElementById(errId).textContent = e.message; } };
}

// SI label with at most 1 decimal: 2500000 -> "2.5M", 640000 -> "640k".
const si = v => { const [d, u] = Math.abs(v) >= 1e6 ? [1e6, 'M'] : Math.abs(v) >= 1e3 ? [1e3, 'k'] : [1, '']; return +(v / d).toFixed(1) + u; };
// Round 1/2/5×10ⁿ ticks over [0, max], each labelled "abs (pct% of total)".
function pctTicks(max, total) {
  const raw = max / 6, mag = 10 ** Math.floor(Math.log10(raw)), step = [1, 2, 5, 10].map(f => f * mag).find(s => s >= raw);
  const tickvals = []; for (let v = 0; v <= max + 1e-9; v += step) tickvals.push(v);
  return { tickmode: 'array', tickvals, ticktext: tickvals.map(v => `${si(v)} (${Math.round(v / total * 100)}%)`) };
}

function drawHousing() {
  const num = v => v.trim() === '' ? null : +v;
  const plan = [...document.querySelectorAll('#hplan tr')].map(tr => tr.querySelectorAll('input')).map(([s, e, r, i, a, l], n) => {
    const [avgift, lump] = [[a, 'avgift'], [l, 'lump sum']].map(([el, name]) => {
      const v = calc(el.value);
      el.classList.toggle('bad', Number.isNaN(v));
      if (Number.isNaN(v)) throw new Error(`Row ${n + 1}: can't evaluate ${name} "${el.value}".`);
      return v;
    });
    return { start: num(s.value), end: num(e.value), repay: num(r.value), interest: num(i.value), avgift, lump };
  }).filter(s => s.start !== null && s.start > 0 && s.start <= 100 && (s.end === null || s.end >= s.start));
  if (!plan.length) throw new Error('Add at least one row with a start year between 0 and 100 (and end year ≥ start year).');
  // Horizon: the latest end year; if any row is open-ended, run until the mortgage is paid off (capped at 100 years).
  const mortgage = amount('mortgage', 'mortgage'), down = amount('down', 'down payment'), value = mortgage + down;
  if (!(value > 0)) throw new Error('Mortgage + down payment must be positive.');
  const lastEnd = rnd(Math.max(...plan.map(s => s.end ?? s.start)) * 12);
  // (a row with only a lump sum and no end year doesn't make the plan open-ended)
  const open = plan.some(s => s.end === null && [s.repay, s.interest, s.avgift].some(v => v !== null));
  let d = monthly(mortgage, plan, open ? 1200 : lastEnd);
  if (open) {
    const off = d.remaining.findIndex(v => v <= 1e-6), n = Math.max(lastEnd, off < 0 ? 1200 : off + 1);
    for (const k in d) d[k] = d[k].slice(0, n);
  }
  d.paid = d.paid.map(v => v + down); // equity: down payment + repaid, so paid + remaining = mortgage + down payment
  let cum = down; d.cumulative = d.total.map((v, i) => cum += v + d.lump[i]); // down payment + monthly totals + lump sums
  let av = 0; d.cumulative_ex = d.cumulative.map((v, i) => v - (av += d.avgift[i])); // same, excluding avgift
  const months = d.total.length;
  const x = d.total.map((_, i) => ymLabel(i + 1));
  const t = (k, extra) => ({ x, y: d[k], name: k, hovertemplate: hover, ...extra });
  const bal = k => ({ yaxis: 'y2', line: { dash: 'dash' }, legendgroup: 'b', customdata: d[k].map(v => v / value),
                      hovertemplate: '%{y:,.0f} (%{customdata:.0%})<extra></extra>' });
  const y2max = Math.max(...d.paid, ...d.remaining, ...d.cumulative);
  Plotly.react('plot-housing', [
    t('repayment', { legendgroup: 'p', legendgrouptitle: { text: 'Left axis (payment)' } }),
    t('interest', { legendgroup: 'p' }), t('avgift', { legendgroup: 'p' }), t('total', { legendgroup: 'p' }),
    t('paid', { ...bal('paid'), legendgrouptitle: { text: 'Right axis (balance)' } }), t('remaining', bal('remaining')),
    t('cumulative', { ...bal('cumulative'), name: 'cumulative', line: { dash: 'dot' } }),
    t('cumulative_ex', { ...bal('cumulative_ex'), name: 'cumulative ex. avgift', line: { dash: 'dot' } }),
  ], {
    xaxis: monthAxis(months), hovermode: 'x unified',
    yaxis: { title: { text: 'SEK / month' }, rangemode: 'tozero', tickformat: '~s' },
    yaxis2: { title: { text: 'SEK balance (% of total)' }, overlaying: 'y', side: 'right', showgrid: false,
              range: [0, y2max * 1.03], ...pctTicks(y2max, value) },
    ...legendLayout({ l: 70, r: 300 }, { l: 60, r: 95 }), uirevision: 'housing',
  }, { responsive: true });
}

// Evaluate numbers like "3,000,000" or "2.7e6", or simple arithmetic like "12*2000" or "(5000+3000)*12".
function calc(v) {
  v = v.replace(/,/g, '').trim(); // commas are thousand separators
  if (v === '') return null;
  if (!/^(\d*\.?\d+(e[+-]?\d+)?|\d+\.|[\s+\-*/()])+$/i.test(v)) return NaN; // numbers (incl. 2.7e6), operators, parens
  try { const r = Function(`"use strict"; return (${v});`)(); return typeof r === 'number' && isFinite(r) ? r : NaN; }
  catch { return NaN; }
}

function drawSavings() {
  const num = v => v.trim() === '' ? null : +v;
  const plan = [...document.querySelectorAll('#plan tr')].map(tr => tr.querySelectorAll('input')).map(([s, e, a, c, r], i) => {
    const start = num(s.value), end = num(e.value), add = calc(a.value);
    a.classList.toggle('bad', Number.isNaN(add));
    if (Number.isNaN(add)) throw new Error(`Row ${i + 1}: can't evaluate yearly addition "${a.value}".`);
    return { year: end === null ? start : [start, end], yearly_addition: add ?? 0,
             yearly_addition_change: num(c.value) ?? 0, yearly_growth_rate: num(r.value) };
  }).filter(seg => [].concat(seg.year).every(y => y !== null && y > 0 && y <= 100));
  if (!plan.length) { Plotly.purge('plot-savings'); throw new Error('Add at least one row with a start year between 0 and 100.'); }
  const d = compound(amount('base', 'base'), plan), x = d.total.map((_, i) => ymLabel(i + 1));
  Plotly.react('plot-savings', [
    { x, y: d.contributed, name: 'contributed', stackgroup: 'one', hovertemplate: hover },
    { x, y: d.return, name: 'return', stackgroup: 'one', hovertemplate: hover },
    { x, y: d.total, name: 'total', line: { dash: 'dot', color: 'black' }, hovertemplate: hover },
  ], {
    xaxis: monthAxis(x.length), yaxis: { title: { text: 'SEK' }, tickformat: '~s' }, hovermode: 'x unified',
    ...legendLayout({ l: 70, r: 130 }, { l: 60, r: 20 }), uirevision: 'savings',
  }, { responsive: true });
}

// textCols: columns that take amounts with commas/arithmetic (text inputs); the rest are number inputs.
function addRow(tbody, textCols, values = Array(document.getElementById(tbody).closest('table').querySelectorAll('th').length - 1).fill('')) {
  const tr = document.createElement('tr');
  tr.innerHTML = values.map((v, i) => `<td><input ${textCols.includes(i) ? 'type="text" inputmode="decimal"' : 'type="number"'} value="${v}"></td>`).join('') + '<td><button title="Remove row">×</button></td>';
  document.getElementById(tbody).append(tr);
}
const removeRow = redraw => e => { if (e.target.tagName === 'BUTTON') { e.target.closest('tr').remove(); redraw(); } };

const housing = guarded(drawHousing, 'err-housing'), savings = guarded(drawSavings, 'err-savings');
document.getElementById('housing').addEventListener('input', housing);
document.getElementById('base').addEventListener('input', savings);
document.getElementById('plan').addEventListener('input', savings);
document.getElementById('hplan').addEventListener('click', removeRow(housing));
document.getElementById('plan').addEventListener('click', removeRow(savings));
document.getElementById('hadd').addEventListener('click', () => { addRow('hplan', [4, 5]); housing(); });
document.getElementById('add').addEventListener('click', () => { addRow('plan', [2]); savings(); });
addRow('hplan', [4, 5], [1, 30, 0.02, 0.03, '6,000', '']);
addRow('plan', [2], [1, 30, '12*12000', 0.01, 0.09]);
housing(); savings();
// Re-lay out when crossing the narrow/wide breakpoint (e.g. rotating a phone); Plotly handles ordinary resizes itself.
let wasNarrow = isNarrow();
window.addEventListener('resize', () => { if (isNarrow() !== wasNarrow) { wasNarrow = !wasNarrow; housing(); savings(); if (auto.res) { drawPareto(); drawSelected(); } } });

// ===================== Auto tab: Monte Carlo strategy search (maths in estimator_notes.md) =====================
// The functions from mulberry32 to runGrid are self-contained: they are also stringified into a Web Worker.
function mulberry32(a) { // small seeded PRNG, so every strategy sees the same random market paths
  return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function normals(n, seed) { // n standard normals (Box–Muller)
  const rand = mulberry32(seed), z = new Float64Array(n);
  for (let i = 0; i < n; i += 2) {
    const r = Math.sqrt(-2 * Math.log(1 - rand())), th = 2 * Math.PI * rand();
    z[i] = r * Math.cos(th); if (i + 1 < n) z[i + 1] = r * Math.sin(th);
  }
  return z;
}
function amortRate(B, q) { // Swedish amortisation requirement from loan-to-value (+1% if loan > 4.5× gross income)
  const ltv = B / q.V;
  return (ltv > 0.7 ? 0.02 : ltv > 0.5 ? 0.01 : 0) + (q.income > 0 && B > 4.5 * q.income ? 0.01 : 0);
}
// One simulated path for one strategy pol = { alpha, theta, lump }:
//  - each month: required repayment + after-tax interest + avgift come out of the budget; of the surplus, a share alpha
//    is prepaid while LTV > theta, the rest is invested (a negative surplus is withdrawn from savings);
//  - each year end, if lump !== null: move savings above the buffer into the loan, down to LTV = lump at most.
// Monthly savings growth factors per path: lognormal with mean (1+g)^(1/12), times the yearly tax on capital.
// Precomputed once and shared by all strategies (common random numbers); G = null means the expected path.
function growth(q, seed) {
  const z = normals(q.paths * q.N, seed), mu = Math.log(1 + q.g) / 12 - q.sig * q.sig / 24, sd = q.sig / Math.sqrt(12), tax = (1 - q.kappa) ** (1 / 12);
  return z.map(v => Math.exp(mu + sd * v) * tax);
}
function simPath(q, pol, G, path, rec) {
  const N = q.N, g0 = ((1 + q.g) * (1 - q.kappa)) ** (1 / 12);
  let B = q.L, P = q.P0, p = 0, X = q.X, tT = Infinity, tF = Infinity, tTF = Infinity, ruin = false, yr = null;
  for (let m = 0; m < N; m++) {
    if (m % 12 === 0) { // amortisation requirement and budget are re-set once a year
      p = amortRate(B, q); X = q.X * (1 + q.dX) ** (m / 12);
      if (rec && rec.years) rec.years.push(yr = { repay: 0, invest: 0, lump: 0 });
    }
    const R = Math.min(q.L * p / 12, B), s = X - R - B * q.r / 12 * (1 - q.tau) - q.A;
    B -= R;
    const u = s > 0 && B / q.V > pol.theta ? Math.min(pol.alpha * s, B) : 0, v = s - u;
    B -= u;
    // if savings are negative (budget too small), the shortfall is treated as borrowed at the mortgage rate
    P = P * (P < 0 ? 1 + q.r / 12 : G ? G[path * N + m] : g0) + v;
    if (P < 0) ruin = true;
    let lump = 0;
    if ((m + 1) % 12 === 0 && pol.lump !== null && B / q.V > pol.lump) {
      lump = Math.max(Math.min(B - pol.lump * q.V, P - q.buffer), 0); B -= lump; P -= lump;
    }
    if (yr) { yr.repay += R + u; yr.invest += v; yr.lump += lump; }
    if (B < 1e-6) { B = 0; if (tF === Infinity) tF = m + 1; }
    if (P >= q.S && tT === Infinity) tT = m + 1;
    if (B === 0 && P >= q.S && tTF === Infinity) tTF = m + 1;
    if (rec && rec.P) { rec.P[path * N + m] = P; rec.B[path * N + m] = B; }
  }
  return { W: P - B, tT, tF, tTF, ruin };
}
function quantile(arr, q) { const s = Float64Array.from(arr).sort(); return s[Math.min(s.length - 1, Math.max(0, Math.ceil(q * s.length) - 1))]; }
function policies() { // alpha 0..1 × theta × lump rule (theta is irrelevant when alpha = 0)
  const out = [];
  for (const lump of [null, 0.7, 0.5, 0]) for (let a = 0; a <= 10; a++) for (const theta of a ? [0.7, 0.5, 0.25, 0] : [0]) out.push({ alpha: a / 10, theta, lump });
  return out;
}
function runGrid(q, progress) {
  const G = growth(q, 12345), pols = policies(), res = [];
  pols.forEach((pol, k) => {
    const W = [], tT = [], tF = [], tTF = []; let ruin = 0;
    for (let i = 0; i < q.paths; i++) { const o = simPath(q, pol, G, i, null); W.push(o.W); tT.push(o.tT); tF.push(o.tF); tTF.push(o.tTF); ruin += o.ruin; }
    // pessimistic net worth = (1-conf) quantile; times = conf quantile (e.g. "reached by then in 90% of paths")
    res.push({ pol, wLow: quantile(W, 1 - q.conf), wMed: quantile(W, 0.5), tT: quantile(tT, q.conf), tF: quantile(tF, q.conf), tTF: quantile(tTF, q.conf), ruin: ruin / q.paths });
    if (progress && k % 8 === 0) progress(k / pols.length);
  });
  return res;
}

const workerSrc = [mulberry32, normals, amortRate, growth, simPath, quantile, policies, runGrid].map(String).join('\n') +
  '\nonmessage = e => postMessage({ done: runGrid(e.data, p => postMessage({ progress: p })) });';
const auto = { q: null, res: null, sel: 0, worker: null, clickBound: false };
const goalKey = { networth: null, target: 'tT', both: 'tTF', payoff: 'tF' };
const pct = v => `${Math.round(v * 100)}%`;
const tm = m => m === Infinity ? 'not within horizon' : ymLabel(m);
const fmt = v => Math.round(v).toLocaleString('en-US');
function describe(pol) {
  const pre = pol.alpha === 0 ? 'Invest all surplus'
    : `Prepay ${pct(pol.alpha)} of surplus ${pol.theta > 0 ? `until LTV ≤ ${pct(pol.theta)}` : 'until paid off'}, invest the rest`;
  return pre + (pol.lump === null ? '; no lump sums' : `; yearly lump sums from savings above the buffer, down to LTV ${pct(pol.lump)}`);
}

function readAuto() {
  const v = (id, label, lo, hi, dflt) => {
    const x = amount(id, label) ?? dflt;
    if (x === null || !(x >= lo && x <= hi)) { document.getElementById(id).classList.add('bad'); throw new Error(`${label} must be between ${lo} and ${hi}.`); }
    return x;
  };
  const L = v('a-L', 'Mortgage', 0, 1e9), D = v('a-D', 'Down payment', 0, 1e9);
  if (!(L + D > 0)) throw new Error('Mortgage + down payment must be positive.');
  const S = calc(document.getElementById('a-S').value);
  return {
    L, V: L + D, r: v('a-r', 'Interest rate', 0, 1), A: v('a-A', 'Avgift', 0, 1e7), income: v('a-inc', 'Income', 0, 1e9, 0),
    X: v('a-X', 'Monthly budget', 0, 1e8), dX: v('a-dX', 'Budget change', -0.5, 1), P0: v('a-P0', 'Starting savings', -1e9, 1e10),
    buffer: v('a-buf', 'Savings buffer', 0, 1e10), g: v('a-g', 'Expected return', -0.5, 1), sig: v('a-sig', 'Volatility', 0, 1),
    tau: v('a-tau', 'Interest deduction', 0, 1), kappa: v('a-kappa', 'Investment tax', 0, 0.5),
    S: S === null || Number.isNaN(S) ? Infinity : S, N: Math.round(v('a-N', 'Horizon', 1, 100) * 12),
    conf: v('a-conf', 'Confidence', 0.5, 0.99), paths: Math.round(v('a-paths', 'Simulated paths', 100, 5000)),
    goal: document.getElementById('a-goal').value,
  };
}

function runAuto() {
  const err = document.getElementById('err-auto'), status = document.getElementById('a-status');
  let q;
  try { q = readAuto(); err.textContent = ''; } catch (e) { err.textContent = e.message; return; }
  if (q.goal !== 'networth' && q.goal !== 'payoff' && q.S === Infinity) { err.textContent = 'Set a savings target for this objective.'; return; }
  status.textContent = 'Running…';
  const done = res => { status.textContent = `${res.length} strategies × ${q.paths} paths`; auto.q = q; auto.res = res; auto.sel = rank()[0]; drawPareto(); drawSelected(); };
  auto.worker?.terminate();
  try { auto.worker = new Worker(URL.createObjectURL(new Blob([workerSrc], { type: 'text/javascript' }))); } catch { auto.worker = null; }
  if (!auto.worker) { setTimeout(() => done(runGrid(q)), 0); return; } // no Worker support: run on the page (UI pauses briefly)
  auto.worker.onmessage = e => e.data.done ? done(e.data.done) : status.textContent = `Running… ${pct(e.data.progress)}`;
  auto.worker.onerror = e => { e.preventDefault(); auto.worker = null; done(runGrid(q)); };
  auto.worker.postMessage(q);
}

// Strategies sorted best-first: feasible ones (shortfall risk ≤ 1 - conf) first, then by the goal's time (if any),
// then by pessimistic final net worth. Returns indices into auto.res.
function rank() {
  const { q, res } = auto, key = goalKey[q.goal], cmp = (a, b) => a === b ? 0 : a < b ? -1 : 1;
  const ok = r => r.ruin <= 1 - q.conf;
  return res.map((_, i) => i).sort((i, j) => {
    const a = res[i], b = res[j];
    return (ok(b) - ok(a)) || (key ? cmp(a[key], b[key]) : 0) || cmp(b.wLow, a.wLow);
  });
}
// x axis of the trade-off chart: the goal's time; for "net worth" use debt-free+target (or payoff if no target).
const xKey = () => goalKey[auto.q.goal] ?? (auto.q.S < Infinity ? 'tTF' : 'tF');
const xLabel = { tT: 'savings target reached', tTF: 'debt-free and target reached', tF: 'debt-free' };

function drawPareto() {
  const { q, res } = auto, k = xKey(), H = q.N / 12, best = rank()[0];
  const ok = r => r.ruin <= 1 - q.conf, xv = r => r[k] === Infinity ? H : r[k] / 12;
  const front = new Set(res.map((r, i) => i).filter(i => ok(res[i]) && !res.some((o, j) => j !== i && ok(o) &&
    o[k] <= res[i][k] && o.wLow >= res[i].wLow && (o[k] < res[i][k] || o.wLow > res[i].wLow))));
  const text = r => `${describe(r.pol)}<br>${xLabel[k]}: ${tm(r[k])} (${pct(q.conf)} conf.)<br>final net worth: ${fmt(r.wLow)} (pessimistic), ${fmt(r.wMed)} (median)<br>shortfall risk: ${pct(r.ruin)}`;
  const trace = (idx, name, marker) => ({ x: idx.map(i => xv(res[i])), y: idx.map(i => res[i].wLow), customdata: idx, text: idx.map(i => text(res[i])),
    mode: 'markers', type: 'scatter', name, marker, hovertemplate: '%{text}<extra></extra>' });
  const all = res.map((_, i) => i);
  Plotly.react('plot-pareto', [
    trace(all.filter(i => ok(res[i]) && !front.has(i)), 'other strategies', { color: '#bbb', size: 7 }),
    trace(all.filter(i => !ok(res[i])), `shortfall risk > ${pct(1 - q.conf)}`, { color: 'crimson', symbol: 'x', size: 7 }),
    trace([...front], 'best trade-offs', { color: '#1f77b4', size: 9 }),
    trace([best], 'best for objective', { color: 'gold', symbol: 'star', size: 16, line: { color: 'black', width: 1 } }),
    trace([auto.sel], 'selected', { color: 'rgba(0,0,0,0)', size: 20, line: { color: 'black', width: 2 } }),
  ], {
    xaxis: { title: { text: `years until ${xLabel[k]} (${pct(q.conf)} of paths; ${H} = not within horizon)` }, range: [0, H * 1.03] },
    yaxis: { title: { text: `final net worth, worst ${pct(1 - q.conf)} (SEK)` }, tickformat: '~s' },
    hovermode: 'closest', ...legendLayout({ l: 70, r: 200 }, { l: 60, r: 20 }),
  }, { responsive: true });
  if (!auto.clickBound) { // click a point to inspect that strategy
    document.getElementById('plot-pareto').on('plotly_click', e => { auto.sel = e.points[0].customdata; drawPareto(); drawSelected(); });
    auto.clickBound = true;
  }
}

function drawSelected() {
  const { q, res } = auto, r = res[auto.sel], N = q.N, n = q.paths;
  const rec = { P: new Float64Array(n * N), B: new Float64Array(n * N) }, G = growth(q, 12345);
  for (let i = 0; i < n; i++) simPath(q, r.pol, G, i, rec);
  const W = rec.P.map((v, i) => v - rec.B[i]), lo = 1 - q.conf, hi = q.conf;
  const band = arr => { // per-month quantiles across paths
    const out = [[], [], []], col = new Float64Array(n);
    for (let m = 0; m < N; m++) {
      for (let i = 0; i < n; i++) col[i] = arr[i * N + m];
      col.sort(); [lo, 0.5, hi].forEach((qq, k) => out[k].push(col[Math.min(n - 1, Math.max(0, Math.ceil(qq * n) - 1))]));
    }
    return out;
  };
  const x = Array.from({ length: N }, (_, m) => ymLabel(m + 1)), tr = [];
  for (const [name, arr, color] of [['savings', rec.P, '31,119,180'], ['loan', rec.B, '214,39,40'], ['net worth', W, '44,160,44']]) {
    const [a, med, b] = band(arr);
    tr.push({ x, y: a, name: `${name} ${pct(lo)}`, line: { width: 0 }, legendgroup: name, showlegend: false, hovertemplate: hover },
            { x, y: b, name: `${name} ${pct(hi)}`, line: { width: 0 }, fill: 'tonexty', fillcolor: `rgba(${color},0.15)`, legendgroup: name, showlegend: false, hovertemplate: hover },
            { x, y: med, name: `${name} (median)`, line: { color: `rgb(${color})` }, legendgroup: name, hovertemplate: hover });
  }
  Plotly.react('plot-fan', tr, {
    xaxis: monthAxis(N), yaxis: { title: { text: `SEK (median, ${pct(lo)}–${pct(hi)} band)` }, tickformat: '~s' }, hovermode: 'x unified',
    ...legendLayout({ l: 70, r: 160 }, { l: 60, r: 20 }),
  }, { responsive: true });
  const best = rank()[0] === auto.sel;
  document.getElementById('auto-summary').innerHTML =
    `<b>${best ? 'Best for objective' : 'Selected'}:</b> ${describe(r.pol)}.<br>` +
    `Final net worth (savings − loan): median ${fmt(r.wMed)}, worst ${pct(lo)} ${fmt(r.wLow)} · ` +
    `debt-free: ${tm(r.tF)} · savings target: ${tm(r.tT)} · both: ${tm(r.tTF)} (each reached in ${pct(q.conf)} of paths) · ` +
    `shortfall risk: ${pct(r.ruin)} ` +
    `<button id="a-apply">Apply to manual</button>`;
  document.getElementById('a-apply').onclick = () => applyToManual(q, r.pol);
}

// Fill the manual tab with the selected strategy run on the expected-return path (no volatility), one row per year.
function applyToManual(q, pol) {
  const rec = { years: [] }; simPath(q, pol, null, 0, rec);
  const set = (id, v) => document.getElementById(id).value = fmt(v);
  set('mortgage', q.L); set('down', q.V - q.L); set('base', q.P0);
  for (const id of ['hplan', 'plan']) document.getElementById(id).innerHTML = '';
  const H = [], S = [], rho = +((1 + q.g) * (1 - q.kappa) - 1).toFixed(5);
  rec.years.forEach((y, i) => {
    const yr = i + 1, rate = q.L ? +(y.repay / q.L).toFixed(5) : 0, last = H[H.length - 1];
    if (last && last[2] === rate && !y.lump) last[1] = yr; // merge consecutive years with the same repayment and no lump
    else H.push([yr, yr, rate, q.r, fmt(q.A), y.lump ? fmt(-y.lump) : '']);
    const lastS = S[S.length - 1], add = Math.round(y.invest);
    if (lastS && lastS[2] === fmt(add) && lastS[1] === yr - 1) lastS[1] = yr;
    else S.push([yr, yr, fmt(add), 0, yr === 1 ? rho : '']);
    if (y.lump) S.push([yr, '', fmt(-y.lump), '', '']); // the lump sum leaves savings at the same year end
  });
  H.forEach(row => addRow('hplan', [4, 5], row)); S.forEach(row => addRow('plan', [2], row));
  showTab('manual'); housing(); savings();
}

function showTab(name) {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  for (const t of ['manual', 'auto']) document.getElementById(`tab-${t}`).hidden = t !== name;
  if (name === 'auto' && !auto.res) runAuto();
  // charts drawn while hidden have no size; resize the visible ones
  document.querySelectorAll(`#tab-${name} .plot`).forEach(el => el.data && Plotly.Plots.resize(el));
}
document.querySelector('.tabs').addEventListener('click', e => e.target.dataset.tab && showTab(e.target.dataset.tab));
document.getElementById('a-run').addEventListener('click', runAuto);
document.getElementById('auto-inputs').addEventListener('keydown', e => e.key === 'Enter' && runAuto());

</script>
</body>
</html>
